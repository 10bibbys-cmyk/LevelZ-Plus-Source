name: Verify LevelZ+ 2.1.3.1 public source

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Validate public source
        run: python3 tools/verify_public_source.py
      - name: Build production JAR
        run: gradle --no-daemon clean build --stacktrace
      - name: Validate JAR and metadata
        shell: bash
        run: |
          set -euo pipefail
          jar='build/libs/levelz-plus-2.1.3.1+mc1.20.1.jar'
          test -s "$jar"
          unzip -t "$jar" >/dev/null
          unzip -p "$jar" fabric.mod.json | grep -Fq '"version": "2.1.3.1+mc1.20.1"'
          unzip -Z1 "$jar" | grep -Fq 'levelz_plus_jobsaddon.mixins.json'
          unzip -Z1 "$jar" | grep -Fq 'levelz_plus_felled.mixins.json'
      - name: Upload verified production JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: levelz-plus-2.1.3.1-public-source
          path: |
            build/libs/levelz-plus-2.1.3.1+mc1.20.1.jar
            release/CURSEFORGE_DESCRIPTION.md
            release/CURSEFORGE_CHANGELOG_2.1.3.1.md
            BUILDING.md
            CHANGELOG.md
            README.md
            LICENSE
            NOTICE.md
          if-no-files-found: error
