plugins { id 'fabric-loom' version '1.8.13'; id 'maven-publish' }
version='2.1.3.1+mc1.20.1'
group='com.pathoftheascended.levelzplus'
base { archivesName='levelz-plus' }

repositories {
 mavenCentral()
 maven { url='https://maven.fabricmc.net/' }
 maven { url='https://maven.shedaniel.me/' }
 maven { url='https://maven.terraformersmc.com/releases/' }
 maven { url='https://api.modrinth.com/maven' }
 maven { url='https://cursemaven.com' }
}

dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modCompileOnly 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'

 // Verified Fabric 1.20.1 gameplay and compatibility compile targets.
 modCompileOnly 'maven.modrinth:EFtixeiF:gYSnmSW4' // LevelZ 1.4.13
 modCompileOnly 'maven.modrinth:5sy6g3kz:qxfX3jsR' // Better Combat 1.8.6+1.20.1 Fabric
 modCompileOnly 'maven.modrinth:XvoWJaA2:Fh2MJAAe' // Spell Engine 0.15.12+1.20.1
 modCompileOnly 'curse.maven:small-ships-450659:9118603' // Small Ships 2.0.1 Fabric 1.20.1
 modCompileOnly 'maven.modrinth:BpwWFOVM:E9PUxeM9' // Bountiful 6.0.4+1.20.1 Fabric
 modCompileOnly 'maven.modrinth:XZNI4Cpy:nvqkBIsD' // Tom's Simple Storage 1.7.1 Fabric 1.20.1
 modCompileOnly 'maven.modrinth:sUbuUC7R:Xk06pIkO' // Actually Harvest 1.1.4.0 Fabric 1.20.1

 modCompileOnly 'maven.modrinth:jobsaddon:1.1.6+1.20.1' // optional JobsAddon 1.1.6 API
 modCompileOnly 'me.shedaniel.cloth:cloth-config-fabric:11.1.118' // JobsAddon config API compile linkage

 // Fabric Loader 0.16.14 already supplies MixinExtras 0.4.1 at runtime.
 compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
 annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
}

java {
 toolchain.languageVersion=JavaLanguageVersion.of(17)
 withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
 options.release=17
 options.encoding='UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
 preserveFileTimestamps=false
 reproducibleFileOrder=true
}
